[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyslow"
version = "0.1.0"
description = "Python freestyle Gomoku engine derived from SlowRenju design"
requires-python = ">=3.11"

[project.optional-dependencies]
gui = ["pygame>=2.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
